<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f8fb">
    <title>Imprelio · Prima e dopo</title>
    <meta name="description" content="Confronta la versione precedente e la versione rivista del sito di Imprelio.">
    <link rel="icon" href="./dopo/imprelio-favicon.ico" sizes="any">
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #111e2d; background: #f6f8fb; }
      body { margin: 0; padding-inline: clamp(18px, 5vw, 60px); }
      main { max-width: 740px; margin: clamp(48px, 12vh, 110px) auto; }
      .brand { display: flex; align-items: center; gap: 9px; font-size: 1.25rem; font-weight: 740; }
      h1 { margin: 24px 0 10px; font-size: clamp(2.25rem, 7vw, 4rem); letter-spacing: -.055em; line-height: 1; }
      p { margin: 0; color: #4b5c70; line-height: 1.55; }
      nav { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 26px; }
      a { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 20px; border: 1px solid #c1ccda; border-radius: 8px; background: #fff; color: inherit; text-decoration: none; }
      a strong { display: block; margin-bottom: 4px; font-size: 1.2rem; }
      a small { color: #4b5c70; font-size: .9375rem; }
      .after { background: #f69459; border-color: #f69459; }
      .after small { color: #111e2d; }
      a:focus-visible { outline: 3px solid #a83e1d; outline-offset: 4px; }
      @media (hover: hover) and (pointer: fine) { a:hover { border-color: #111e2d; } }
      @media (max-width: 480px) { nav { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <main>
      <div class="brand"><img src="./dopo/imprelio-mark.png" alt="" width="34" height="34">Imprelio</div>
      <h1>Prima e dopo</h1>
      <p>Apri le due versioni del sito di Imprelio per confrontarle.</p>
      <nav aria-label="Versioni del sito">
        <a href="./prima/"><span><strong>Prima</strong><small>Versione precedente</small></span><span aria-hidden="true">→</span></a>
        <a class="after" href="./dopo/"><span><strong>Dopo</strong><small>Versione rivista</small></span><span aria-hidden="true">→</span></a>
      </nav>
    </main>
  </body>
</html>
